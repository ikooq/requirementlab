[project]
name = "requirementlab"
version = "1.3.0"
description = "AI-агент статической проверки требований (ISO/IEC/IEEE 29148, IEEE 830)"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "python-dotenv>=1.0", "pypdf>=4.0", "python-docx>=1.1", "pymupdf>=1.24,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
